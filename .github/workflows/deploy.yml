name: Deploy Operation January to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Bound to the same "github-pages" environment the deploy job uses: if
    # VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY were ever configured as
    # environment secrets (rather than repository secrets), only a job bound
    # to that environment can read them — this is what silently produced a
    # Supabase-disabled production build in the past (run #30) despite the
    # secrets existing. Harmless if they're repository secrets instead.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Verify Supabase build config
        env:
          RAW_URL: ${{ secrets.VITE_SUPABASE_URL }}
          RAW_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Presence/shape only — never echoes a secret value. A build that
          # silently ships with Mission Hunt/League Check Intelligence
          # disabled is worse than a build that fails loudly here.
          #
          # Trims leading/trailing whitespace (a copy-paste-into-the-GitHub-
          # secrets-UI newline is a real, previously-seen cause of a
          # secret's shape check failing even when the visible value looks
          # right) and exports the CLEANED values via GITHUB_ENV so the
          # Build step below uses the trimmed value, not the raw one — a
          # trailing newline baked into the bundle could otherwise break
          # createClient()'s URL parsing at runtime.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          URL=$(trim "$RAW_URL")
          KEY=$(trim "$RAW_KEY")

          echo "SUPABASE URL CONFIGURED: $([ -n "$URL" ] && echo yes || echo no) (raw length ${#RAW_URL}, trimmed length ${#URL})"
          echo "SUPABASE KEY CONFIGURED: $([ -n "$KEY" ] && echo yes || echo no) (raw length ${#RAW_KEY}, trimmed length ${#KEY})"
          # TEMPORARY diagnostic: a hex dump doesn't contain the secret as a
          # literal substring, so GitHub's log masking won't redact it, and
          # it pinpoints invisible/non-ASCII characters (smart quotes,
          # NBSP, zero-width space) that a plain length check can't. The
          # project URL itself isn't sensitive — it ships to every browser
          # — so this is safe either way. Remove once the mismatch is found.
          echo "URL hex dump:"; printf '%s' "$URL" | od -An -tx1c

          MISSING=0
          if [ -z "$URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not set for this build (repository or 'github-pages' environment secret)."
            MISSING=1
          elif ! printf '%s' "$URL" | grep -qE '^https://[A-Za-z0-9-]+\.supabase\.co/?$'; then
            # Hard fail, not a warning: this field must be a URL. A key
            # pasted into this field would otherwise ship straight to the
            # browser bundle — this exact mistake shipped a live sb_secret_
            # key to production once already (see git history around this
            # step).
            echo "::error::VITE_SUPABASE_URL does not look like https://<ref>.supabase.co (trimmed length ${#URL}). If this is actually an API key (sb_publishable_/sb_secret_/eyJ...), it's in the wrong secret slot and must be fixed before this can build."
            MISSING=1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY is not set for this build (repository or 'github-pages' environment secret)."
            MISSING=1
          elif printf '%s' "$KEY" | grep -qE '^sb_secret_'; then
            # A secret key must never be used as the client-side anon key —
            # it bypasses RLS entirely. Hard fail rather than ship it.
            echo "::error::VITE_SUPABASE_ANON_KEY looks like a Supabase SECRET key (sb_secret_...), not a publishable/anon key. Never use a secret key client-side — fix the secret value before this can build."
            MISSING=1
          elif ! printf '%s' "$KEY" | grep -qE '^(sb_publishable_|eyJ)'; then
            echo "::warning::VITE_SUPABASE_ANON_KEY is set but doesn't match a known publishable/anon key prefix — double-check the value."
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Supabase is not configured for this build. Failing rather than silently deploying Mission Hunt/League Check Intelligence disabled. See MISSION_HUNT_SETUP.md."
            exit 1
          fi

          echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY come from the preflight
          # step above via GITHUB_ENV — already validated and whitespace-
          # trimmed, not re-read raw from secrets.* here.
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
